name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run astro check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Keep the build for Lighthouse
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  lighthouse:
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lighthouse mobile
        run: |
          npx --yes @lhci/cli@0.15.1 collect --config=lighthouserc.cjs
          npx --yes @lhci/cli@0.15.1 upload --config=lighthouserc.cjs
          npx --yes @lhci/cli@0.15.1 assert --config=lighthouserc.cjs

      - name: Lighthouse desktop
        if: ${{ !cancelled() }}
        env:
          LH_FORM_FACTOR: desktop
        run: |
          npx --yes @lhci/cli@0.15.1 collect --config=lighthouserc.cjs
          npx --yes @lhci/cli@0.15.1 upload --config=lighthouserc.cjs
          npx --yes @lhci/cli@0.15.1 assert --config=lighthouserc.cjs

      - name: Keep the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lighthouse
          retention-days: 30
